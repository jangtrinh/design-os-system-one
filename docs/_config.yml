# GitHub Pages site for jev, built from this docs/ folder.
# _layouts/default.html wraps every Markdown page in the landing's design language;
# index.html is a hand-built page (layout: null) sharing assets/site.css.
# jekyll-seo-tag emits <title>, <meta name="description">, Open Graph and JSON-LD;
# jekyll-sitemap emits sitemap.xml for Google Search Console.
title: design-os-system-one
description: "TypeSafe System 1 & Dual-Brain Architecture: sub-10ms on-device decisions, 5-stage speculative commit engine, and 95% LLM cost reduction for autonomous agents."
url: https://jangtrinh.github.io
baseurl: /design-os-system-one
lang: en
repository: jangtrinh/design-os-system-one
repository_url: https://github.com/jangtrinh/design-os-system-one
author:
  name: "Jang Trịnh"
  twitter: jangtrinh
twitter:
  username: jangtrinh
wordmark: JANGTRINH
wordmark_url: https://github.com/jangtrinh
eyebrow: AGENTIC SYSTEM 1 · DUAL-BRAIN ARCHITECTURE          # short product family label, e.g. design:os
logo: /images/cover.png          # a real capture under docs/images/
nav:                        # primary navigation tabs (exactly 2 main items)
  - { title: "Case Study", url: "/case-study.html" }
  - { title: "Primitives", url: "/02-core-primitives.html" }
nav_more:                   # items nested inside More dropdown
  - { title: "Architecture", url: "/08-architectural-patterns.html", meta: "patterns" }
  - { title: "API Reference", url: "/05-rest-api-reference.html", meta: "rest" }
  - { title: "Cookbooks & Recipes", url: "/09-cookbooks-and-recipes.html", meta: "code" }
  - { title: "All Documentation", url: "/00-index.html", meta: "10 guides" }
  - { title: "Art Direction Spec", url: "/ART-DIRECTION.md", meta: "3D spec" }
footer:
  - { title: "GitHub", url: "https://github.com/jangtrinh/design-os-system-one" }
  - { title: "Case Study", url: "https://jangtrinh.github.io/design-os-system-one/case-study.html" }
  - { title: "MIT", url: "https://github.com/jangtrinh/design-os-system-one/blob/main/LICENSE" }
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "google*.html" }
    values: { sitemap: false }
